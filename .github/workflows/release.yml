name: Release

# Pushing a tag such as v0.2.0 publishes a playable build. Nothing else triggers this, so an ordinary commit
# to main never produces a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Framework dependent, matching the README: players are already asked to install the .NET 10 runtime,
      # and bundling it would roughly triple the download.
      - name: Publish
        run: >
          dotnet publish src/Minecraft.App/Minecraft.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish

      # Same guard the build workflow runs. A release missing a shader is a release that crashes on launch.
      - name: Verify runtime assets
        run: ./.github/scripts/Verify-RuntimeAssets.ps1 -SourceRoot src -OutputDirectory publish
        shell: pwsh

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          Compress-Archive -Path publish/* -DestinationPath "Minecraft-$tag-win-x64.zip"
          "archive=Minecraft-$tag-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:tag $env:archive
          --title $env:tag
          --generate-notes
          --repo ${{ github.repository }}
