name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes back to the repository.
permissions:
  contents: read

# A superseded run of the same branch is of no interest once a newer commit is in.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The existing sources predate .editorconfig and do not pass a repository wide `dotnet format`, so this
  # checks only the files a pull request touches. New and edited code is held to the style rules without
  # a sweeping reformat of everything else first.
  format:
    if: github.event_name == 'pull_request'
    # Same Windows constraint as the build job: loading the workspace restores net10.0-windows projects.
    runs-on: windows-latest
    name: Format

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # dotnet format needs the merge base present to diff against.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Collect changed C# files
        id: changed
        run: >
          ./.github/scripts/Get-ChangedSources.ps1
          -BaseSha '${{ github.event.pull_request.base.sha }}'
          -HeadSha '${{ github.event.pull_request.head.sha }}'
        shell: pwsh

      - name: Verify formatting
        if: steps.changed.outputs.any == 'true'
        run: >
          dotnet format Minecraft.slnx --verify-no-changes --severity warn
          --include ${{ steps.changed.outputs.files }}
        shell: pwsh

  build:
    # Both projects target net10.0-windows, and texture loading goes through System.Drawing, which is
    # Windows only. There is no cross platform configuration to fall back to.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    name: ${{ matrix.configuration }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Minecraft.slnx

      - name: Build
        run: dotnet build Minecraft.slnx --configuration ${{ matrix.configuration }} --no-restore

      # The tests cover the parts of the engine that answer the same way every time: inventories, crafting,
      # harvesting, the wire format, the save format and the start arguments. Nothing here opens a window or
      # needs a GPU, so it runs on the same machine the build does.
      - name: Test
        run: dotnet test Minecraft.slnx --configuration ${{ matrix.configuration }} --no-build

      # Shaders and resources are read at runtime by a path relative to the executable, so one that fails to
      # be copied still compiles and only breaks when the game is launched. A missing sphere.obj surfaced as
      # a NullReferenceException three layers away from the actual cause, which is what this guards against.
      - name: Verify runtime assets
        run: >
          ./.github/scripts/Verify-RuntimeAssets.ps1
          -SourceRoot src
          -OutputDirectory src/Minecraft.App/bin/${{ matrix.configuration }}/net10.0-windows
        shell: pwsh

      - name: Upload build output
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-${{ matrix.configuration }}
          path: src/Minecraft.App/bin/${{ matrix.configuration }}/net10.0-windows
          retention-days: 7
