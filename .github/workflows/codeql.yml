name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Analysis rules are updated after the code is written, so a scheduled run catches findings that no commit
  # would have triggered.
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyze C#
    # Same reason as the build workflow: both projects target net10.0-windows and will not compile elsewhere.
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # autobuild does not understand the .slnx solution format, so the build below is done by hand.
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: dotnet build Minecraft.slnx --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
